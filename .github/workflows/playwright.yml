name: Playwright Tests
on:
  pull_request:
    branches: [ main, hotfix/* ]
    paths:
      # Trigger when workflow file or 
      # files in frontend folder change
      - ".github/workflows/playwright.yml"
      - ".github/actions/npm-install-with-cache/**"
      - "src/MobiFlightConnector/frontend/**"

  workflow_dispatch:
    inputs:
      workers:
        description: "Playwright workers per shard (e.g. 2 or 50%)"
        required: false

env:
  DEFAULT_CI_WORKERS: 2

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/MobiFlightConnector/frontend
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/npm-install-with-cache
    - name: Run linter
      run: npm run lint
    - name: Run unit tests
      run: npm run test

  test:
    needs: checks
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: ${{ fromJSON(vars.CI_PLAYWRIGHT_SHARDS || '["1/2","2/2"]') }}
    defaults:
      run:
        working-directory: src/MobiFlightConnector/frontend
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/npm-install-with-cache
    - name: Get Playwright version
      id: playwright-version
      run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium
    - name: Install Playwright system dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium
    - name: Run Playwright tests
      env:
        CI_WORKERS: ${{ inputs.workers || vars.CI_PLAYWRIGHT_WORKERS || env.DEFAULT_CI_WORKERS }}
        TESTS_MEMBER_EMAIL: ${{ vars.TESTS_MEMBER_EMAIL }}
        TESTS_MEMBER_NAME: ${{ vars.TESTS_MEMBER_NAME }}
        TESTS_MEMBER_PASSWORD: ${{ secrets.TESTS_MEMBER_PASSWORD }}
        TESTS_BASIC_EMAIL: ${{ vars.TESTS_BASIC_EMAIL }}
        TESTS_BASIC_NAME: ${{ vars.TESTS_BASIC_NAME }}
        TESTS_BASIC_PASSWORD: ${{ secrets.TESTS_BASIC_PASSWORD }}
      run: npx playwright test --shard=${{ matrix.shard }}