version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      # Packages shipped with the .NET runtime (monthly servicing releases)
      dotnet-runtime:
        patterns:
          - "System.*"
          - "Microsoft.Extensions.*"
        exclude-patterns:
          - "System.Reactive"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "devcontainers"
    directory: "/src/MobiFlightConnector/frontend/.devcontainer"
    schedule:
      interval: "daily"
  - package-ecosystem: "npm"
    directory: "/src/MobiFlightConnector/frontend"
    schedule:
      interval: "daily"